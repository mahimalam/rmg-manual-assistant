[project]
name = "rmg-manual-assistant"
version = "0.1.0"
description = "Local manual-grounded assistant with Bangla voice input"
requires-python = ">=3.11,<3.13"
dependencies = [
  "streamlit>=1.45,<2",
  "pymupdf>=1.25,<2",
  "numpy>=2,<3",
  "sentence-transformers>=4,<6",
  "chromadb>=1,<2",
  "faster-whisper>=1.2,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "transformers>=4.48,<5",
  "torch>=2.6,<3",
  "uroman>=1.3,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
